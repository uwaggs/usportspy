[project]
name = "usportspy"
version = "0.0.11"
description = "Extract and Analyze Data from U SPORTS, the Governing Body of University Sport in Canada."
readme = "PYPI.md"
requires-python = ">=3.8"
dependencies = [
    "requests",
    "pandas",
    "pyjanitor",
]

[project.urls]
Homepage = "https://github.com/uwaggs/usportspy"
Documentation = "https://github.com/uwaggs/usportspy/wiki"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
